# Canonical skill → aliases. `aliases` match case-insensitively on word boundaries.
# `strict` forms are ordinary English words too ("Go", "C", "Excel"); in free text they match only when written
# exactly as listed, but they still normalise case-insensitively when they appear in a structured skills list.
# Keep canonical names lowercase; `display` is what the UI shows.
# To add a skill: append an entry; aliases must not collide with another skill's canonical name or aliases.
