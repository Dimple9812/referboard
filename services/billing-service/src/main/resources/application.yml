server:
  port: ${PORT:8089}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: billing-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/referboard?currentSchema=billing,public}
    username: ${DB_USERNAME:billing_svc}
    password: ${DB_PASSWORD:billing_svc}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: billing
        jdbc.time_zone: UTC
  flyway:
    schemas: billing
    default-schema: billing
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 15000
        request.timeout.ms: 10000

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

referboard:
  security:
    jwt:
      jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:referboard-auth}
      audience: ${JWT_AUDIENCE:referboard}
  billing:
    # Razorpay API keys (Dashboard → Account & Settings → API Keys). Empty = payments are switched off and the
    # app says so; nothing else changes. Use rzp_test_ keys until you're ready to take real money.
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com}
    business-name: ${BILLING_BUSINESS_NAME:ReferBoard}
    plans:
      PRO_MONTH:
        name: Pro for 1 month
        amount-paise: ${PRO_MONTH_PRICE_PAISE:29900}
        days: 30
      PRO_YEAR:
        name: Pro for 1 year
        amount-paise: ${PRO_YEAR_PRICE_PAISE:249900}
        days: 365
    # Unpaid orders are marked EXPIRED after this long (Razorpay orders can't be paid twice anyway).
    order-ttl: PT2H

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
