# Companies whose public ATS job boards ReferBoard ingests (Greenhouse, Lever and Ashby public posting APIs).
#
#   - name: Display name shown in the app
#     ats: GREENHOUSE | LEVER | ASHBY
#     slug: board token from the public careers URL:
#             boards.greenhouse.io/<slug>  ·  jobs.lever.co/<slug>  ·  jobs.ashbyhq.com/<slug>
#     enabled: false        # optional; stop fetching without deleting history
#
# Slugs were compiled from companies' public careers-page URLs and could not all be verified when this list was
# written. Companies also switch ATS vendors. That's handled at runtime: a board that returns 404 is marked
# NOT_FOUND, skipped, and re-checked weekly. List them with  GET /api/ingestion/sources?status=NOT_FOUND
# (ADMIN token) and fix or remove the entries here. Only these documented public board APIs are called.
