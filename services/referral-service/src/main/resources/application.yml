server:
  port: ${PORT:8085}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: referral-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/referboard?currentSchema=referral,public}
    username: ${DB_USERNAME:referral_svc}
    password: ${DB_PASSWORD:referral_svc}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: referral
        jdbc.time_zone: UTC
  flyway:
    schemas: referral
    default-schema: referral
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 15000
        request.timeout.ms: 10000
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

referboard:
  security:
    jwt:
      jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:referboard-auth}
      audience: ${JWT_AUDIENCE:referboard}
  ai:
    llm:
      provider: ${LLM_PROVIDER:auto}
      anthropic:
        api-key: ${ANTHROPIC_API_KEY:}
        model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
      openai:
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_MODEL:gpt-4.1-mini}
    embedding:
      provider: hashing          # referral-service doesn't use embeddings
  clients:
    # Empty = resolve through Eureka (lb://). Set a URL to call a service directly (local runs, tests).
    job-service-url: ${JOB_SERVICE_URL:}
    profile-service-url: ${PROFILE_SERVICE_URL:}
  referral:
    send-referral-after: ${REFERRAL_SEND_REFERRAL_AFTER:P2D}   # "Connected 2 days ago — send your referral message"
    follow-up-after: ${REFERRAL_FOLLOW_UP_AFTER:P5D}           # "No reply in 5 days — follow up"
    reminder-scan-interval-ms: 300000
    max-contacts-per-job: 25
    max-ai-drafts-per-day: ${REFERRAL_MAX_AI_DRAFTS_PER_DAY:120}   # ~30 AI draft requests per user per day; template drafts beyond that

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
