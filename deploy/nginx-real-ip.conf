# Production only (mounted by deploy/compose.prod.yml). nginx sits behind Caddy, so $remote_addr would be
# Caddy's container address and every user would share one rate-limit bucket. Trust X-Forwarded-For from
# the Docker network only (nginx isn't published, so nothing else can reach it); nginx then forwards the real
# client address to the gateway as before.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
