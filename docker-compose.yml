# Local development stack. `docker compose up --build`
# Services are added here as each one is implemented and tested (see README "Build status").

name: referboard

x-service-env: &service-env
  EUREKA_URL: http://discovery-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}
  JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  JWT_ISSUER: ${JWT_ISSUER:-referboard-auth}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-referboard}

services:

  # ---------- infrastructure ----------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: referboard
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d referboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  # Local mail catcher: every email the app sends lands here (web UI on :8025). Not for production.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports: ["8025:8025", "1025:1025"]

  # ---------- platform ----------
  discovery-server:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: infrastructure/discovery-server }
    ports: ["8761:8761"]
    environment:
      EUREKA_HOSTNAME: discovery-server
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8761'"]
      interval: 10s
      retries: 20

  # Single entry point for the frontend: http://localhost:8080 (API) and /swagger-ui.html (all services' docs).
  frontend:
    build:
      context: ./frontend
      args: { VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}" }
    ports: ["${FRONTEND_PORT:-3000}:80"]
    environment:
      GATEWAY_URL: http://api-gateway:8080
    depends_on:
      api-gateway: { condition: service_started }

  api-gateway:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: infrastructure/api-gateway }
    # Localhost only: browsers come in through the frontend's nginx, which sets X-Forwarded-For. Publishing this
    # port to the network would let clients spoof that header. `npm run dev` (Vite on :5173) uses it from the host.
    ports: ["127.0.0.1:8080:8080"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-referboard-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-referboard}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}   # the nginx frontend is same-origin
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      EXPENSIVE_RATE_LIMIT_PER_MINUTE: ${EXPENSIVE_RATE_LIMIT_PER_MINUTE:-10}
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-true}   # nginx overwrites it with the real client address
    depends_on:
      discovery-server: { condition: service_healthy }
      redis: { condition: service_healthy }

  auth-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: services/auth-service }
    ports: ["8081:8081"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/referboard?currentSchema=auth,public
      DB_USERNAME: ${AUTH_DB_USERNAME:-auth_svc}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_svc}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_KEY_DIR: /data/keys
      JWT_REFRESH_REUSE_GRACE: ${JWT_REFRESH_REUSE_GRACE:-PT30S}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Browsers allow Secure cookies on http://localhost; set false only for non-localhost plain-HTTP setups.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    volumes: [authkeys:/data/keys]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  profile-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: services/profile-service }
    ports: ["8082:8082"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/referboard?currentSchema=profile,public
      DB_USERNAME: ${PROFILE_DB_USERNAME:-profile_svc}
      DB_PASSWORD: ${PROFILE_DB_PASSWORD:-profile_svc}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_DIR: /data/resumes
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-referboard-resumes}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes: [resumes:/data/resumes]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_started }

  job-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: services/job-service }
    ports: ["8083:8083"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/referboard?currentSchema=job,public
      DB_USERNAME: ${JOB_DB_USERNAME:-job_svc}
      DB_PASSWORD: ${JOB_DB_PASSWORD:-job_svc}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_started }

  ingestion-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: services/ingestion-service }
    ports: ["8084:8084"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/referboard?currentSchema=ingestion,public
      DB_USERNAME: ${INGESTION_DB_USERNAME:-ingestion_svc}
      DB_PASSWORD: ${INGESTION_DB_PASSWORD:-ingestion_svc}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      INGESTION_CRON: ${INGESTION_CRON:-0 0 */6 * * *}
      INGESTION_USER_AGENT: ${INGESTION_USER_AGENT:-ReferBoardBot/0.1 (+https://github.com/your-org/referboard)}
      # Local dev: seed fictional sample jobs and run once on startup so the app has data immediately.
      INGESTION_SAMPLE_DATA: ${INGESTION_SAMPLE_DATA:-true}
      INGESTION_RUN_ON_STARTUP: ${INGESTION_RUN_ON_STARTUP:-true}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  referral-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: services/referral-service }
    ports: ["8085:8085"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/referboard?currentSchema=referral,public
      DB_USERNAME: ${REFERRAL_DB_USERNAME:-referral_svc}
      DB_PASSWORD: ${REFERRAL_DB_PASSWORD:-referral_svc}
      # Drafting: Claude if a key is set, otherwise deterministic template drafts.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # job-service and profile-service are resolved through Eureka (JOB_SERVICE_URL / PROFILE_SERVICE_URL override).
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      job-service: { condition: service_started }
      profile-service: { condition: service_started }

  resume-analyzer-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: services/resume-analyzer-service }
    ports: ["8086:8086"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/referboard?currentSchema=analyzer,public
      DB_USERNAME: ${ANALYZER_DB_USERNAME:-analyzer_svc}
      DB_PASSWORD: ${ANALYZER_DB_PASSWORD:-analyzer_svc}
      # JD parsing and rewrites with Claude if a key is set; heuristics and rule-based suggestions otherwise.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      ANALYZER_FREE_PER_MONTH: ${ANALYZER_FREE_PER_MONTH:-5}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      job-service: { condition: service_started }
      profile-service: { condition: service_started }

  tracker-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: services/tracker-service }
    ports: ["8087:8087"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/referboard?currentSchema=tracker,public
      DB_USERNAME: ${TRACKER_DB_USERNAME:-tracker_svc}
      DB_PASSWORD: ${TRACKER_DB_PASSWORD:-tracker_svc}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      job-service: { condition: service_started }

  notification-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: services/notification-service }
    ports: ["8088:8088"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/referboard?currentSchema=notification,public
      DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-notification_svc}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_svc}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-ReferBoard <noreply@referboard.local>}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3000}   # nginx proxies /api
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      mailpit: { condition: service_started }

volumes:
  resumes:
  pgdata:
  redisdata:
  kafkadata:
  authkeys:
