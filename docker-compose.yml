# Local development stack. `docker compose up --build`
# Services are added here as each one is implemented and tested (see README "Build status").

name: referboard

x-service-env: &service-env
  EUREKA_URL: http://discovery-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}
  JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  JWT_ISSUER: ${JWT_ISSUER:-referboard-auth}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-referboard}

services:

  # ---------- infrastructure ----------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: referboard
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d referboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  # ---------- platform ----------
  discovery-server:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: infrastructure/discovery-server }
    ports: ["8761:8761"]
    environment:
      EUREKA_HOSTNAME: discovery-server
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8761'"]
      interval: 10s
      retries: 20

  auth-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: services/auth-service }
    ports: ["8081:8081"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/referboard?currentSchema=auth,public
      DB_USERNAME: ${AUTH_DB_USERNAME:-auth_svc}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_svc}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_KEY_DIR: /data/keys
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Browsers allow Secure cookies on http://localhost; set false only for non-localhost plain-HTTP setups.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    volumes: [authkeys:/data/keys]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  kafkadata:
  authkeys:
