# Rendered by the nginx image's envsubst step: only ${GATEWAY_URL} is substituted.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 6m;           # resume and JD uploads are capped at 5 MB by the services
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/ https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://accounts.google.com/gsi/ https://*.razorpay.com; img-src 'self' data: https:; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass ${GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;          # with the port, so the gateway sees a same-origin request
        # Overwrite, don't append: the gateway trusts the last hop, and that must be the real client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 150s;       # JD analysis with an LLM can take up to two minutes
        proxy_send_timeout 150s;
    }

    location = /.well-known/jwks.json {
        proxy_pass ${GATEWAY_URL};
    }

    # Hashed build assets never change; cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes all serve the app shell, which must not be cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/ https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://accounts.google.com/gsi/ https://*.razorpay.com; img-src 'self' data: https:; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
